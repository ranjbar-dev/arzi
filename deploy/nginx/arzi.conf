# Install: sudo cp deploy/nginx/arzi.conf /etc/nginx/sites-available/arzi
#          sudo ln -s /etc/nginx/sites-available/arzi /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Plain HTTP only — TLS is Cloudflare's job (dashboard: SSL/TLS -> Overview -> Flexible).
# Browser <-HTTPS-> Cloudflare <-HTTP-> this nginx <-HTTP-> web. No cert on this box.
#
# Proxies to `web` (docker-compose.prod.yml publishes it to 127.0.0.1:${WEB_PORT} — match the
# port below to whatever WEB_PORT is set to in the server's .env, default 3000). `web`'s own
# next.config.ts rewrite already proxies /api/v1/* to `api` server-to-server, so nginx only
# ever needs to reach `web`.

server {
    listen 80;
    server_name ranjbar.dev www.ranjbar.dev;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare already sets this to "https" (the browser's real scheme) — pass it through
        # instead of $scheme, which would say "http" (this hop is plain HTTP by design).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
