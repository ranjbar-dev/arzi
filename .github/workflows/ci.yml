name: CI / CD

# Test on every push/PR; deploy only after tests pass, and only for pushes to main.
# Deploy reuses the existing docker-compose shape (`build:` context, not `image:` — see
# docker-compose.yml) by having the server pull and rebuild itself over SSH. No registry.
# Schema migrations stay a separate manual step (migrate.yml) — this workflow never runs
# `sqlx migrate run` against prod.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Start db
        run: |
          cp .env.example .env
          docker compose up -d db
          timeout 60 sh -c 'until docker compose exec -T db pg_isready -U arzi -d arzi; do sleep 1; done'

      - name: Cache sqlx-cli
        id: cache-sqlx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ runner.os }}-0.8

      - name: Install sqlx-cli
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version ^0.8 --no-default-features --features postgres,rustls

      - name: Run migrations
        working-directory: api
        env:
          DATABASE_URL: postgres://arzi:change_me@localhost:5432/arzi
        run: sqlx migrate run

      - name: fmt
        working-directory: api
        run: cargo fmt --check

      - name: clippy
        working-directory: api
        env:
          DATABASE_URL: postgres://arzi:change_me@localhost:5432/arzi
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: api
        env:
          DATABASE_URL: postgres://arzi:change_me@localhost:5432/arzi
        run: cargo test

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - working-directory: web
        run: npm run lint

      - working-directory: web
        run: npm run build
        env:
          API_INTERNAL_URL: http://api:8080

  deploy:
    needs: [test-api, test-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Required repository secrets:
      #   DEPLOY_HOST     - server IP/hostname
      #   DEPLOY_PORT     - SSH port
      #   DEPLOY_USER     - SSH user
      #   DEPLOY_PASSWORD - SSH password
      #   DEPLOY_PATH     - absolute path to this repo's checkout on the server (e.g. /srv/arzi)
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
