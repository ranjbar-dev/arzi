name: CI / CD

# Test on every push/PR; deploy only after tests pass, and only for pushes to main.
# Path-filtered: api/* changes trigger only backend jobs, web/* changes trigger only frontend
# jobs — they run as separate, parallel jobs (not one shared job), so an api-only commit never
# spins up node/npm and vice versa.
# Deploy reuses the existing docker-compose shape (`build:` context, not `image:` — see
# docker-compose.yml) by having the server pull and rebuild itself over SSH. No registry.
# Both deploy jobs share one git checkout on the server, so they're pinned to the same
# concurrency group (deploy-main) to serialize the `git reset --hard` step — still two separate,
# independently-triggered jobs, just not literally simultaneous on the server.
# Schema migrations stay a separate manual step (migrate.yml) — this workflow never runs
# `sqlx migrate run` against prod.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.github/workflows/ci.yml'

  lint-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          shared-key: lint

      - run: sudo apt-get update && sudo apt-get install -y mold

      - name: Start db
        run: |
          cp .env.example .env
          docker compose up -d db
          timeout 60 sh -c 'until docker compose exec -T db pg_isready -U arzi -d arzi; do sleep 1; done'

      - name: Cache sqlx-cli
        id: cache-sqlx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ runner.os }}-0.8

      - name: Install sqlx-cli
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version ^0.8 --no-default-features --features postgres,rustls

      - name: Run migrations
        working-directory: api
        env:
          DATABASE_URL: postgres://arzi:change_me@localhost:5432/arzi
        run: sqlx migrate run

      - name: fmt
        working-directory: api
        run: cargo fmt --check

      - name: clippy
        working-directory: api
        env:
          DATABASE_URL: postgres://arzi:change_me@localhost:5432/arzi
        run: cargo clippy --all-targets -- -D warnings

  test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          shared-key: test

      - run: sudo apt-get update && sudo apt-get install -y mold

      - name: Start db
        run: |
          cp .env.example .env
          docker compose up -d db
          timeout 60 sh -c 'until docker compose exec -T db pg_isready -U arzi -d arzi; do sleep 1; done'

      - name: Cache sqlx-cli
        id: cache-sqlx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ runner.os }}-0.8

      - name: Install sqlx-cli
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version ^0.8 --no-default-features --features postgres,rustls

      - name: Run migrations
        working-directory: api
        env:
          DATABASE_URL: postgres://arzi:change_me@localhost:5432/arzi
        run: sqlx migrate run

      - name: test
        working-directory: api
        env:
          DATABASE_URL: postgres://arzi:change_me@localhost:5432/arzi
        run: cargo test

  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - working-directory: web
        run: npm run lint

      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.[jt]s', 'web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - working-directory: web
        run: npm run build
        env:
          API_INTERNAL_URL: http://api:8080

  deploy-api:
    needs: [changes, lint-api, test-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      # Required repository secrets:
      #   DEPLOY_HOST     - server IP/hostname
      #   DEPLOY_PORT     - SSH port
      #   DEPLOY_USER     - SSH user
      #   DEPLOY_PASSWORD - SSH password
      #   DEPLOY_PATH     - absolute path to this repo's checkout on the server (e.g. /srv/arzi)
      #   DEPLOY_ENV_FILE - full contents of production .env (copy .env.example, fill in every
      #                      change_me* with a real secret, set SESSION_COOKIE_SECURE=true) —
      #                      pasted as one multiline secret, written verbatim to .env on the
      #                      server on every deploy. TLS/domain routing is host nginx, not .env
      #                      (deploy/nginx/arzi.conf).
      #   ADMIN_USERNAME  - optional, defaults to "admin"
      #   ADMIN_PASSWORD  - password for the bootstrap superuser (default tenant, first login).
      #                      Only ever used to create the account if it's missing (ON CONFLICT DO
      #                      NOTHING below) — rotate it via the admin UI afterwards, not by
      #                      changing this secret.
      - name: SSH deploy api
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_ENV_FILE,ADMIN_USERNAME,ADMIN_PASSWORD
          # Default 10m isn't enough for a from-scratch `cargo-chef cook` on a fresh server (no
          # Docker layer cache yet) - the typst dep tree alone is ~150 crates. Later deploys reuse
          # cargo-chef's cached layer when Cargo.lock is unchanged and finish in a fraction of this.
          command_timeout: 40m
          script: |
            set -e
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "${{ secrets.DEPLOY_PATH }}"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            printf '%s\n' "$DEPLOY_ENV_FILE" > .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps db api

            # Bootstrap the default tenant + first superuser (idempotent — ON CONFLICT DO
            # NOTHING). `api` runs migrations on boot, so wait for the `users` table before
            # inserting. Password is hashed with a throwaway container since the api image
            # has no CLI for it (api/src/auth/mod.rs's Argon2::default()).
            : "${ADMIN_USERNAME:=admin}"
            set -a; . ./.env; set +a
            timeout 120 sh -c 'until docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1 FROM users" >/dev/null 2>&1; do sleep 2; done'
            ADMIN_HASH=$(docker run --rm alpine sh -c "apk add -q argon2 openssl >/dev/null 2>&1 && printf '%s' \"$ADMIN_PASSWORD\" | argon2 \$(openssl rand -hex 16) -id -e")
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v admin_user="$ADMIN_USERNAME" -v admin_hash="$ADMIN_HASH" <<'SQL'
            INSERT INTO tenants (slug, name) VALUES ('default', 'Arzi') ON CONFLICT (slug) DO NOTHING;
            INSERT INTO users (tenant_id, username, password_hash, is_superuser)
            SELECT id, :'admin_user', :'admin_hash', true FROM tenants WHERE slug = 'default'
            ON CONFLICT (tenant_id, username) DO NOTHING;
            SQL

            docker image prune -f

  deploy-web:
    needs: [changes, test-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      # Same repository secrets as deploy-api (DEPLOY_HOST/PORT/USER/PASSWORD/PATH/ENV_FILE) —
      # see that job for descriptions.
      - name: SSH deploy web
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_ENV_FILE
          command_timeout: 40m
          script: |
            set -e
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "${{ secrets.DEPLOY_PATH }}"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            printf '%s\n' "$DEPLOY_ENV_FILE" > .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps web
            docker image prune -f
